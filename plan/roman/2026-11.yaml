  - date: 2026-11-21
    type: strength
    title: "Upper body: press & pull"
    exercises:
      - { name: Overhead Press, sets: 3, reps: 6, weight: 35 }
      - { name: Pull Ups, sets: 4, reps: 5 }
      - { name: Incline Bench Press, sets: 3, reps: 8, weight: 40 }
      - { name: Preacher Curls, sets: 3, reps: 8, weight: 25 }
      - { name: Sit Ups, sets: 3, reps: 30 }
    notes: First session after the injury, keep everything easy. Easy on the ankle, overhead press standing is fine, curls only seated on the preacher bench. For pull-ups, step down onto the bench, never jump down. If gripping hurts the hand, stop and make it a meditation day

