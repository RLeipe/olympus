name: Keep Supabase Active

on:
  schedule:
    # Run every 3 days at 10:00 AM UTC
    - cron: '0 10 */3 * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  ping-database:
    runs-on: ubuntu-latest

    steps:
      - name: Execute SQL query via Management API to keep database active
        run: |
          response=$(curl -s -w "\n%{http_code}" \
            -X POST "https://api.supabase.com/v1/projects/${{ secrets.SUPABASE_PROJECT_REF }}/database/query" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ACCESS_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{"query": "SELECT 1"}')

          http_code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | head -n-1)

          echo "HTTP status: $http_code"
          echo "Response: $body"

          if [[ ! "$http_code" =~ ^2[0-9][0-9]$ ]]; then
            echo "ERROR: Expected 2xx, got $http_code" >&2
            exit 1
          fi

          echo "Supabase pinged successfully at $(date)"
